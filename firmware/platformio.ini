; Magic Cube — cubo RGB interactivo con orientación (ESP32)
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

; Común a todos los entornos
[env]
platform = espressif32
board = esp32dev
framework = arduino

; Dos espacios de programa de 1,9 MB (ota_0 / ota_1) para poder actualizar el
; firmware por Bluetooth desde la web. El firmware ocupa ~1,25 MB. La NVS
; (calibración, mapa de caras) queda en el mismo lugar que con huge_app.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Abrir el monitor no reinicia la placa (DTR/RTS inactivos). Para ver el
; arranque, botón EN de la placa.
monitor_dtr = 0
monitor_rts = 0

lib_deps =
    ; 3.10+ no compila con el core Arduino 2.x de espressif32
    fastled/FastLED@~3.9.0

; Driver RMT de FastLED: una sola tira, así que le damos al canal 0 los 8
; bloques de memoria del RMT (512 pulsos). La interrupción que recarga el
; buffer pasa de tener 80 µs de margen a 320 µs: si llega tarde (BLE, flash,
; serie) los LEDs del final de la cadena ven un corte y muestran basura.
; FLASH_LOCK: ninguna escritura en flash (NVS, BLE) interrumpe un show().
build_flags =
    -D FASTLED_RMT_MAX_CHANNELS=1
    -D FASTLED_RMT_MEM_BLOCKS=8
    -D FASTLED_ESP32_FLASH_LOCK=1

; Firmware del cubo
[env:esp32dev]
build_src_filter = +<*> -<led_test/>

; Prueba de los 6 paneles, sin IMU ni BLE:  pio run -e led_test -t upload
[env:led_test]
build_src_filter = -<*> +<led_test/>
